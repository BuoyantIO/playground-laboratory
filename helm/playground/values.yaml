namespace:
  name: playground
  annotations:
    linkerd.io/inject: enabled

# --- Server ------------------------------------------------------------
http:
  image:
    repository: ghcr.io/buoyantio/playground-laboratory/playground-server
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 8080

  primary:
    replicas: 1
    serviceAccount:
      name: playground-server-http-primary
    env:
      APP_VERSION: "v1"
      RESPONSE_TEXT: "hello from primary"
      LATENCY_MS: "0"
      LATENCY_JITTER_MS: "0"
      ERROR_RATE: "0"
      ERROR_CODE: "500"
      FAIL_ON_STARTUP: "false"
      CRASH_AFTER_REQUESTS: "0"
      READINESS_FAIL_RATE: "0"
    resources: {}
    podAnnotations: {}

  canary:
    replicas: 1
    serviceAccount:
      name: playground-server-http-canary
    env:
      APP_VERSION: "v2"
      RESPONSE_TEXT: "hello from canary"
      LATENCY_MS: "0"
      LATENCY_JITTER_MS: "0"
      ERROR_RATE: "0"
      ERROR_CODE: "500"
      FAIL_ON_STARTUP: "false"
      CRASH_AFTER_REQUESTS: "0"
      READINESS_FAIL_RATE: "0"
    resources: {}
    podAnnotations: {}

# --- Dashboard (UI) -----------------------------------------------------
# The interactive dashboard: shows the live request flow + counters and owns
# the generator config (the source of truth the playground-client generator
# pulls). Does not generate traffic itself.
dashboard:
  replicas: 1
  image:
    repository: ghcr.io/buoyantio/playground-laboratory/playground-app
    tag: latest
    pullPolicy: Always
  serviceAccount:
    name: playground-dashboard
  service:
    type: ClusterIP
    port: 3000
  # Seeds the dashboard's config store at boot. The UI can change any of these
  # at runtime, and the generator picks the change up within a couple of seconds.
  env:
    POLL_INTERVAL_MS: "1000"
    POLL_ENABLED: "true"
    CONCURRENCY: "1"
    TARGET_AUTHORITY: "apex"
    TARGET_PATH: "/"
  resources: {}
  podAnnotations: {}

# --- Client (traffic generator) ----------------------------------------
# Always-on, meshed generator. Pulls live config from the dashboard, calls the
# server through the mesh, and pushes each result back to the dashboard. Keeps
# the name/label "playground-client" so it remains the meshed caller the
# runbooks instrument. Runs the same image as the dashboard, different command.
client:
  replicas: 1
  image:
    repository: ghcr.io/buoyantio/playground-laboratory/playground-app
    tag: latest
    pullPolicy: Always
  serviceAccount:
    name: playground-client
  # Fallback defaults used only until the first successful config pull from the
  # dashboard. After that the dashboard's config wins.
  env:
    FETCH_TIMEOUT_MS: "0"
    # How often the generator re-pulls config from the dashboard.
    CONFIG_POLL_MS: "2000"
    POLL_INTERVAL_MS: "1000"
    POLL_ENABLED: "true"
    CONCURRENCY: "1"
    TARGET_AUTHORITY: "apex"
    TARGET_PATH: "/"
  resources: {}
  podAnnotations: {}

# --- Observability subcharts -------------------------------------------
prometheus:
  enabled: false
  forceNamespace: monitoring
  alertmanager:
    namespaceOverride: monitoring
  kube-state-metrics:
    namespaceOverride: monitoring
  prometheus-node-exporter:
    namespaceOverride: monitoring
  prometheus-pushgateway:
    namespaceOverride: monitoring

grafana:
  enabled: false
  namespaceOverride: monitoring
