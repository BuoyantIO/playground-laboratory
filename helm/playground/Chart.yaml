apiVersion: v2
name: playground
description: Playground Demo - dashboard UI, a traffic generator, and a Go server with tunable failure modes
type: application
version: 1.1.0
appVersion: "1.1.0"

dependencies:
  - name: prometheus
    version: 29.6.0
    repository: https://prometheus-community.github.io/helm-charts
    condition: prometheus.enabled
  - name: grafana
    version: 12.3.1
    repository: https://grafana-community.github.io/helm-charts
    condition: grafana.enabled
