apiVersion: v1
kind: Service
metadata:
  name: playground-dashboard
  namespace: {{ .Values.namespace.name }}
  labels:
    app: playground-dashboard
    app.kubernetes.io/part-of: playground
spec:
  type: {{ .Values.dashboard.service.type }}
  selector:
    app: playground-dashboard
  ports:
    - name: http
      port: {{ .Values.dashboard.service.port }}
      targetPort: http
